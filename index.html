<!DOCTYPE html>
<html lang="es">
<head>
  <title>Soporte GatoBarato</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
		<script src="https://kit.fontawesome.com/2ef2dc1b35.js" crossorigin="anonymous"></script>
		<link href="img/gatobarato.png" rel="icon">
		<meta property="og:site_name" content="Gato Barato">
		<meta property="og:title" content="Gato Barato - Soporte Técnico">
		<meta property="og:description" content="Mantenimiento de computadoras, laptops, impresoras e instalación de cámaras de videovigilancia.">
		<meta property="og:image" content="https://dcreate.github.io/PagoGato/img/gatobarato.png">
		<meta property="og:url" content="https://dcreate.github.io/PagoGato/">
		<meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <div class="card">
    <h1>💳 Número de tarjeta</h1>
    <!-- =========================
         TITULAR
         ========================= -->

    <div class="dato">

      <span class="etiqueta">
        TITULAR
      </span>

      <div class="valor" id="titular">
        Cargando...
      </div>

      <button
        class="boton"
        id="botonTitular"
        onclick="copiarDato('titular', 'botonTitular', 'Titular copiado')">

        📋 Copiar nombre

      </button>

    </div>


    <!-- =========================
         TARJETA
         ========================= -->

    <div class="dato">

      <span class="etiqueta">
        NÚMERO DE TARJETA
      </span>

      <div class="valor" id="numero">
        Cargando...
      </div>

      <button
        class="boton"
        id="botonTarjeta"
        onclick="copiarDato('numero', 'botonTarjeta', 'Número copiado')">

        📋 Copiar número

      </button>

    </div>
	<div class="aviso1">
      BBVA Bancomer. 
	</div>
    <div id="mensaje"></div>
    <div class="qr">
      <h3>Escanea el código QR</h3>
      <img id="qrImagen" alt="Código QR">
    </div>
	
    <div class="aviso">
      Mantén esta información privada y compártela únicamente con personas de confianza.
    </div>
  </div>
  
  <script src="generador.js"></script>

 

</body>
</html>
